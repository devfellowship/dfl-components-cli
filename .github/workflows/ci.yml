name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# All real work lives in packages/ui. There is NO package.json at the repo root.
#
# This workflow used to open every generic step with a probe like
# `if [ -f package.json ]; … else echo "⚠️ No package.json found, skipping"; fi`
# executed from the repo ROOT. The probe never matched, so install, build, test,
# typecheck and lint ALL skipped — and the job still printed "✅ CI passed".
# Verified no-op on run 30941973561. The vitest suite added in #105 specifically
# to prevent a silent-degradation bug had therefore never executed once.
#
# The rule this file now follows: a step must never be able to "pass" by not
# running. Nothing here is conditional on a file existing. The preflight step
# asserts the workspace layout up front and FAILS if it ever changes, and the
# final gate treats any outcome that is not exactly `success` — including
# `skipped` — as a failure.
# ─────────────────────────────────────────────────────────────────────────────
env:
  WORKSPACE: packages/ui

jobs:
  ci:
    # Public repo: self-hosted dfl-runner blocked (allows_public=false). ubuntu-latest per CLAUDE.md carve-out.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json

      # ── Preflight: the guard against this workflow going no-op again ───────
      #
      # If the workspace moves or a script is renamed, every step below would
      # otherwise degrade quietly. This turns that into an immediate, loud red
      # with an explicit message instead.
      - name: Preflight — workspace and required scripts exist
        run: |
          set -euo pipefail
          if [ ! -f "$WORKSPACE/package.json" ]; then
            echo "::error::No package.json at $WORKSPACE. The CI workspace moved."
            echo "::error::Update \$WORKSPACE in .github/workflows/ci.yml — do NOT add a"
            echo "::error::'skip if missing' fallback: that is exactly how this job"
            echo "::error::silently stopped running anything (run 30941973561)."
            exit 1
          fi
          missing=0
          for s in build test typecheck; do
            if ! jq -e --arg s "$s" '.scripts[$s]' "$WORKSPACE/package.json" >/dev/null; then
              echo "::error::Required npm script '$s' is missing from $WORKSPACE/package.json"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "✅ workspace=$WORKSPACE with build, test, typecheck"

      # Storybook must have ZERO Docs pages (autodocs / mdx / docs addon banned).
      # Hard gate — no dependencies needed (Node built-ins only). See CLAUDE.md.
      - name: Guard — no Storybook Docs pages
        run: node packages/ui/scripts/check-no-storybook-docs.mjs

      # Design-token lint — catches orphaned / self-referential / duplicate /
      # cyclic custom properties + unbalanced braces in the DS token files.
      # This is the exact bug class that made `rounded-*` compute 0px (radius
      # self-ref) and left --c-* orphaned. Node built-ins only — no deps, so it
      # runs BEFORE install and is a HARD gate. Script vendored at
      # scripts/lint-tokens.mjs (kept in sync with the design-token-lint skill).
      - name: Guard — design tokens (orphaned/self-ref/duplicate vars)
        run: node scripts/lint-tokens.mjs packages/ui/src/styles/*.css

      - name: Install dependencies
        working-directory: packages/ui
        run: npm ci

      - name: Build
        id: build
        working-directory: packages/ui
        run: npm run build
        continue-on-error: true

      - name: Tests (vitest)
        id: tests
        working-directory: packages/ui
        run: npm test
        continue-on-error: true

      - name: Typecheck
        id: typecheck
        working-directory: packages/ui
        run: npm run typecheck
        continue-on-error: true

      # ── ux-paths CLI: offline-safety gate ────────────────────────────────
      #
      # `ux-paths validate` used to fetch its JSON Schema from
      # raw.githubusercontent at validate-time. dfl-ux-paths went PRIVATE on
      # 2026-08-04 and every `validate` run in the published package started
      # 404ing. The schema is vendored now (#105 / 3.0.1); this gate keeps it
      # that way by asserting on the artifact users actually execute.
      #
      # Runs against the bundle produced by the Build step above. No
      # continue-on-error: shipping a CLI that phones home is release-blocking.
      - name: Guard — ux-paths CLI is offline-safe
        working-directory: packages/ui
        run: node scripts/check-cli-bundle-offline.mjs

      # ── FlowCanvas: the optional peers must stay optional ────────────────
      #
      # `@xyflow/react` and `@dagrejs/dagre` are optional peer dependencies, and
      # that promise holds only while <FlowCanvas> stays behind its own
      # `./canvas` entry. A single re-export from src/index.ts would make both
      # mandatory for every consumer of the design system — and the failure
      # would not appear here, it would appear in a consumer's build as an
      # unresolvable module. Asserted against the built bundles.
      #
      # Runs against the Build step above. No continue-on-error: shipping a
      # main entry that drags React Flow in is release-blocking.
      - name: Guard — canvas entry is isolated
        working-directory: packages/ui
        run: node scripts/check-canvas-entry-isolated.mjs

      # NOTE: there is deliberately no eslint step. This package has no eslint
      # config and no eslint dependency. The step that used to sit here wrote
      # `[]` to eslint-report.json and reported success, which claimed a lint
      # had run when none had. Static analysis that DOES run lives in the two
      # hard guards above (check-no-storybook-docs, lint-tokens) plus tsc in
      # Typecheck. If eslint is ever adopted, add it as an unconditional step.

      - name: Check if CI failed
        if: always()
        run: |
          set -uo pipefail
          FAILED=0
          # `skipped` counts as failure: a step that did not run has not passed.
          # That conflation is what let this job report green while doing nothing.
          check() {
            local name="$1" outcome="$2"
            if [ "$outcome" != "success" ]; then
              echo "❌ $name: $outcome"
              FAILED=1
            else
              echo "✅ $name"
            fi
          }
          check "Build"     "${{ steps.build.outcome }}"
          check "Tests"     "${{ steps.tests.outcome }}"
          check "Typecheck" "${{ steps.typecheck.outcome }}"
          if [ "$FAILED" = "1" ]; then exit 1; fi
          echo "✅ CI passed"
