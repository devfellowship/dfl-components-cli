# Public repo: self-hosted dfl-runner blocked (allows_public=false) + cannot call private dfl-ci reusable workflows. Inlined on ubuntu-latest. Authorized Tainan TG 2026-06-06 (public-repo carve-out) + TG 2026-06-10.
name: Auto-assign PR author

# Trigger is `pull_request`, NOT `pull_request_target`. GitHub blocks `pull_request_target` by
# default in public repos (brownouts 2026-11-09 and 2026-11-16 16:00-18:00 UTC, permanent from
# 2026-12-02): the run ends in startup_failure with zero jobs. This job checks out no code, so a
# same-repo PR gets the write token and the org secret under `pull_request`. A fork PR gets a
# read-only token: the assign step then warns and moves on (best-effort, never a gate).
# https://github.blog/changelog/2026-11-02-pull_request_target-blocked-by-default-december-2
on:
  pull_request:
    types: [opened, reopened, synchronize]

# Cancel a superseded run of the same PR. The key is the PR number; a run
# without a PR (push, schedule, dispatch) gets its own run_id group, so it is
# never cancelled. ADR-5 of plan 20260917-fleet-compute-rebalance-render-runners-renovate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  assign:
    runs-on: ubuntu-latest
    # Housekeeping job — never block the PR rollup on it.
    continue-on-error: true
    permissions:
      pull-requests: write
    steps:
      - name: Assign PR author (best-effort)
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          # User-token PAT — App installation tokens cannot assign agents (403).
          github-token: ${{ secrets.ORG_ADMIN_PAT || github.token }}
          script: |
            const author = context.payload.pull_request.user.login;
            const type = context.payload.pull_request.user.type; // "User" or "Bot"

            // [bot] accounts (dependabot, renovate, etc.) cannot be assigned — skip cleanly.
            if (type === 'Bot' || author.endsWith('[bot]')) {
              core.info(`Author "${author}" is a bot account; skipping self-assign (bots can't be assignees).`);
              return;
            }

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                assignees: [author],
              });
              core.info(`Assigned PR #${context.payload.pull_request.number} to ${author}.`);
            } catch (err) {
              // Outside collaborators / suspended users / transient API errors must not fail CI.
              core.warning(`Could not assign PR author "${author}" (non-blocking): ${err.message}`);
            }
