name: Deploy Storybook

# Builds the packages/ui Storybook (Storybook 8.6, @storybook/react-vite) and
# publishes the static build to Cloudflare Pages project `dfl-storybook`
# (custom domain storybook.devfellowship.com). Direct-Upload via wrangler —
# mirrors the dfl-mcp-docs / itera-storybook Pages pattern.
#
# runs-on: ubuntu-latest — public repo carve-out (self-hosted dfl-runner is
# blocked on public devfellowship/* repos, allows_public=false). Authorized
# Tainan TG 2026-06-06. Consistent with this repo's existing ci.yml.

on:
  push:
    branches: [main]
    paths:
      - "packages/ui/**"
      - ".github/workflows/deploy-storybook.yml"
  workflow_dispatch:

concurrency:
  group: deploy-storybook
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # REQUIRED. `cache: npm` looks for a lockfile at the REPO ROOT by
          # default, and there is no package.json or package-lock.json there —
          # everything lives in packages/ui. setup-node then fails the step with
          # "Dependencies lock file is not found in /home/runner/work/…", before
          # install, build or deploy ever run.
          #
          # This job had been red on every push to main since 2026-08-05, so
          # storybook.devfellowship.com stopped receiving new stories while the
          # PR checks stayed green — the deploy runs only on `push: main` and is
          # therefore invisible in a PR rollup. ci.yml already sets this path;
          # this workflow was simply never updated to match.
          cache-dependency-path: packages/ui/package-lock.json

      # packages/ui is NOT an npm workspace of the root — it has its own
      # package-lock.json and its own storybook dep, so install + build there.
      - name: Install dependencies
        working-directory: packages/ui
        run: npm ci

      - name: Build Storybook
        working-directory: packages/ui
        run: npm run build-storybook

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/ui/storybook-static --project-name=dfl-storybook --branch=main
